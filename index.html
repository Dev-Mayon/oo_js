<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animais Falantes</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f7f7f7;
    }
    input, select, button {
      margin: 5px 0;
      padding: 8px;
      font-size: 1rem;
    }
    .saida {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Criador de Animais 🐾</h1>

  <label>Nome do Animal:</label><br>
  <input type="text" id="nomeAnimal" /><br>

  <label>Tipo:</label><br>
  <select id="tipoAnimal">
    <option value="cachorro">Cachorro</option>
    <option value="gato">Gato</option>
  </select><br>

  <button onclick="criarAnimal()">Criar Animal</button>

  <div class="saida" id="saidaTexto"></div>

  <script src="script.js"></script>
</body>
</html>
